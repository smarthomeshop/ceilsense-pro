# Local development WiFi using the repository's ignored secrets.yaml.
switch:
  - platform: gpio
    id: ethernet_power_off
    internal: true
    pin: GPIO48
    restore_mode: ALWAYS_ON

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: "${device_name} Fallback"
    password: ${device_name}

captive_portal:

improv_serial:
  next_url: "http://{{ip_address}}"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "WiFi IP Address"
      id: network_ip
      entity_category: diagnostic
      disabled_by_default: true
    mac_address:
      name: "WiFi MAC"
      id: network_mac
      entity_category: diagnostic
      disabled_by_default: true

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor
    update_interval: 60s
    entity_category: diagnostic
    disabled_by_default: true
