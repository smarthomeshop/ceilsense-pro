# W5500 Ethernet. GPIO48 low enables the switched 3.3 V rail.
switch:
  - platform: gpio
    id: ethernet_power
    internal: true
    pin:
      number: GPIO48
      inverted: true
    restore_mode: ALWAYS_ON

ethernet:
  type: W5500
  clk_pin: GPIO11
  mosi_pin: GPIO9
  miso_pin: GPIO10
  cs_pin: GPIO8
  interrupt_pin: GPIO46
  reset_pin: GPIO3
  clock_speed: 20MHz

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "Ethernet IP Address"
      id: network_ip
      entity_category: diagnostic
      disabled_by_default: true
    mac_address:
      name: "Ethernet MAC"
      id: network_mac
      entity_category: diagnostic
      disabled_by_default: true
