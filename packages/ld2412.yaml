# HLK-LD2412 on UART1 nets TX1/RX1.
uart:
  - id: uart_ld2412
    tx_pin: GPIO19
    rx_pin: GPIO18
    baud_rate: 115200
    parity: NONE
    stop_bits: 1

ld2412:
  id: ld2412_radar
  uart_id: uart_ld2412

text_sensor:
  - platform: ld2412
    ld2412_id: ld2412_radar
    version:
      name: "LD2412 Firmware Version"
      id: ld2412_firmware_version
    mac_address:
      name: "LD2412 MAC"
      id: ld2412_mac

binary_sensor:
  - platform: ld2412
    ld2412_id: ld2412_radar
    has_target:
      name: "LD2412 Presence"
      id: ld2412_presence
      device_class: occupancy
      on_press:
        - light.turn_on:
            id: status_led
            brightness: 60%
            effect: "Presence Active"
      on_release:
        - if:
            condition:
              binary_sensor.is_off: ld2450_presence
            then:
              - light.turn_off: status_led
    has_moving_target:
      name: "LD2412 Moving Target"
      id: ld2412_moving_target
    has_still_target:
      name: "LD2412 Still Target"
      id: ld2412_still_target
    dynamic_background_correction_status:
      name: "LD2412 Dynamic Background Correction"
      id: ld2412_dynamic_background
      entity_category: diagnostic

sensor:
  - platform: ld2412
    ld2412_id: ld2412_radar
    moving_distance:
      name: "LD2412 Moving Distance"
      id: ld2412_moving_distance
    still_distance:
      name: "LD2412 Still Distance"
      id: ld2412_still_distance
    moving_energy:
      name: "LD2412 Moving Energy"
      id: ld2412_moving_energy
    still_energy:
      name: "LD2412 Still Energy"
      id: ld2412_still_energy
    light:
      name: "LD2412 Light"
      id: ld2412_light
      entity_category: diagnostic
    detection_distance:
      name: "LD2412 Detection Distance"
      id: ld2412_detection_distance

switch:
  - platform: ld2412
    ld2412_id: ld2412_radar
    engineering_mode:
      name: "LD2412 Engineering Mode"
      id: ld2412_engineering_mode
      entity_category: config
    bluetooth:
      name: "LD2412 Bluetooth"
      id: ld2412_bluetooth
      entity_category: config

number:
  - platform: ld2412
    ld2412_id: ld2412_radar
    timeout:
      name: "LD2412 Presence Timeout"
      id: ld2412_timeout
      entity_category: config
      icon: mdi:timer-outline
    min_distance_gate:
      name: "LD2412 Minimum Distance Gate"
      id: ld2412_min_gate
      entity_category: config
    max_distance_gate:
      name: "LD2412 Maximum Distance Gate"
      id: ld2412_max_gate
      entity_category: config
    light_threshold:
      name: "LD2412 Light Threshold"
      id: ld2412_light_threshold
      entity_category: config

button:
  - platform: ld2412
    ld2412_id: ld2412_radar
    factory_reset:
      name: "LD2412 Factory Reset"
      id: ld2412_factory_reset
      entity_category: diagnostic
      icon: mdi:backup-restore
    restart:
      name: "LD2412 Restart"
      id: ld2412_restart
      entity_category: diagnostic
      icon: mdi:restart
    query_params:
      name: "LD2412 Query Parameters"
      id: ld2412_query_params
      entity_category: diagnostic
      icon: mdi:playlist-check
    start_dynamic_background_correction:
      name: "LD2412 Start Dynamic Background Correction"
      id: ld2412_start_dbc
      entity_category: diagnostic
      icon: mdi:chart-bell-curve

select:
  - platform: ld2412
    ld2412_id: ld2412_radar
    distance_resolution:
      name: "LD2412 Distance Resolution"
      id: ld2412_distance_resolution
      entity_category: config
    light_function:
      name: "LD2412 Light Function"
      id: ld2412_light_function
      entity_category: config
