# Shared CeilSense Pro hardware.
substitutions:
  project_name: "smarthomeshop.ceilsense_pro"
  project_version: "1.0.0"
  log_level: "INFO"
  i2c_frequency: "100kHz"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: ${project_name}
    version: ${project_version}
  build_path: build/${build_variant}
  on_boot:
    - priority: 520
      then:
        - light.turn_on:
            id: status_led
            brightness: 45%
            red: 0%
            green: 15%
            blue: 100%
        - delay: 750ms
        - light.turn_off:
            id: status_led
            transition_length: 300ms

esp32:
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  level: ${log_level}
  baud_rate: 115200

api:
  # Provision a per-device key at runtime and retain it across OTA updates.
  encryption:
  # Never reboot when Home Assistant is unreachable: the local smoke alarm
  # logic must keep running standalone, and every reboot restarts the
  # ADPD188BI baseline warm-up (blind window of baseline_samples x 10s).
  reboot_timeout: 0s

ota:
  - platform: esphome

safe_mode:

debug:
  update_interval: 15min

web_server:
  port: 80

i2c:
  id: bus_a
  scl: GPIO8
  sda: GPIO10
  scan: true
  frequency: ${i2c_frequency}

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "LED Ring"
    pin: GPIO13
    num_leds: 16
    rgb_order: GRB
    chipset: ws2812
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    effects:
      - addressable_lambda:
          name: "Presence Active"
          update_interval: 250ms
          lambda: |-
            static uint8_t pos = 0;
            it.all() = esphome::Color(0, 0, 0);
            for (uint8_t i = 0; i < it.size(); i++) {
              const bool active = ((i + pos) % 4) == 0;
              it[i] = active ? esphome::Color(0, 160, 50) : esphome::Color(0, 12, 4);
            }
            pos = (pos + 1) % it.size();
      - addressable_lambda:
          name: "Radar Debug"
          update_interval: 500ms
          lambda: |-
            static bool on = false;
            on = !on;
            it.all() = on ? esphome::Color(255, 90, 0) : esphome::Color(0, 0, 0);
      - strobe:
          name: "Smoke Alarm"
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 0%
              duration: 250ms
            - state: false
              duration: 250ms

sensor:
  - platform: internal_temperature
    name: "CPU Temperature"
    id: cpu_temperature
    entity_category: diagnostic

  - platform: bh1750
    name: "Illuminance"
    id: illuminance
    i2c_id: bus_a
    address: 0x23
    update_interval: 60s

  - platform: bmp3xx_i2c
    i2c_id: bus_a
    address: 0x76
    temperature:
      name: "BMP388 Temperature"
      id: bmp_temperature
    pressure:
      name: "BMP388 Pressure"
      id: bmp_pressure
    update_interval: 60s

button:
  - platform: restart
    name: "Restart Device"
    id: btn_restart

  - platform: factory_reset
    name: "Factory Reset"
    id: factory_reset_button
    entity_category: config
    disabled_by_default: true

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
      entity_category: diagnostic
    reset_reason:
      name: "ESP Reset Reason"
      id: esp_reset_reason_text
      entity_category: diagnostic
      disabled_by_default: true

  - platform: template
    name: "Software Version"
    id: ceilsense_software_version_text
    update_interval: 5h
    lambda: |-
      return {"${project_version}"};

  - platform: template
    name: "Hardware Version"
    id: ceilsense_hardware_version_text
    update_interval: 5h
    lambda: |-
      return {"${ceilsense_hardware_version}"};

  - platform: template
    name: "Network Variant"
    id: ceilsense_network_variant_text
    update_interval: 5h
    lambda: |-
      return {"${default_network}"};
