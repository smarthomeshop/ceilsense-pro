# MAX98357A I2S speaker amplifier.
i2s_audio:
  id: i2s_audio_bus
  i2s_bclk_pin: GPIO0
  i2s_lrclk_pin: GPIO1

speaker:
  - platform: i2s_audio
    id: max98357_speaker
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    i2s_dout_pin: GPIO11
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit

media_player:
  - platform: speaker
    id: speaker_media_player
    name: "Speaker"
    announcement_pipeline:
      speaker: max98357_speaker
      format: WAV
      sample_rate: 16000
      num_channels: 1
    buffer_size: 48000
