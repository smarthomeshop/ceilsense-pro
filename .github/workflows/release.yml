name: Release firmware

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  ESPHOME_VERSION: "2026.6.1"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: V1 WiFi LD2450 and LD2412
            file: ceilsense-pro-v1/ceilsense-pro-v1-wifi-ld2450-ld2412.yaml
            artifact: ceilsense-pro-v1-wifi-ld2450-ld2412
          - name: V1 Ethernet LD2450 and LD2412
            file: ceilsense-pro-v1/ceilsense-pro-v1-ethernet-ld2450-ld2412.yaml
            artifact: ceilsense-pro-v1-ethernet-ld2450-ld2412
          - name: V1 WiFi LD2460
            file: ceilsense-pro-v1/ceilsense-pro-v1-wifi-ld2460.yaml
            artifact: ceilsense-pro-v1-wifi-ld2460
          - name: V1 Ethernet LD2460
            file: ceilsense-pro-v1/ceilsense-pro-v1-ethernet-ld2460.yaml
            artifact: ceilsense-pro-v1-ethernet-ld2460
          - name: V1 WiFi LD6002B
            file: ceilsense-pro-v1/ceilsense-pro-v1-wifi-ld6002b.yaml
            artifact: ceilsense-pro-v1-wifi-ld6002b
          - name: V1 Ethernet LD6002B
            file: ceilsense-pro-v1/ceilsense-pro-v1-ethernet-ld6002b.yaml
            artifact: ceilsense-pro-v1-ethernet-ld6002b
    steps:
      - uses: actions/checkout@v7
      - name: Compile firmware
        run: |
          docker run --rm -v "$PWD":/config -w /config \
            "esphome/esphome:${ESPHOME_VERSION}" compile "${{ matrix.file }}"
      - name: Collect release files
        run: |
          mkdir -p dist
          build_dir="ceilsense-pro-v1/build/${{ matrix.artifact }}"
          shopt -s nullglob
          factory_bins=("$build_dir"/.pioenvs/*/firmware.factory.bin)
          ota_bins=("$build_dir"/.pioenvs/*/firmware.bin)
          test "${#factory_bins[@]}" -eq 1
          test "${#ota_bins[@]}" -eq 1
          cp "${factory_bins[0]}" "dist/${{ matrix.artifact }}-${GITHUB_REF_NAME}.factory.bin"
          cp "${ota_bins[0]}" "dist/${{ matrix.artifact }}-${GITHUB_REF_NAME}.ota.bin"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}
          path: dist/*.bin
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.bin --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
