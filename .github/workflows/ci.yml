name: ESPHome CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ESPHOME_VERSION: "2026.6.1"

jobs:
  repository-tests:
    name: Repository tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  build-firmware:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Default WiFi alias
            file: ceilsense-pro-wifi.yaml
            artifact: ceilsense-pro-wifi
            build_variant: ceilsense-pro-v1-wifi-ld2450-ld2412
          - name: Default Ethernet alias
            file: ceilsense-pro-ethernet.yaml
            artifact: ceilsense-pro-ethernet
            build_variant: ceilsense-pro-v1-ethernet-ld2450-ld2412
          - name: V1 WiFi LD2450 and LD2412
            file: ceilsense-pro-v1/ceilsense-pro-v1-wifi-ld2450-ld2412.yaml
            artifact: ceilsense-pro-v1-wifi-ld2450-ld2412
            build_variant: ceilsense-pro-v1-wifi-ld2450-ld2412
          - name: V1 Ethernet LD2450 and LD2412
            file: ceilsense-pro-v1/ceilsense-pro-v1-ethernet-ld2450-ld2412.yaml
            artifact: ceilsense-pro-v1-ethernet-ld2450-ld2412
            build_variant: ceilsense-pro-v1-ethernet-ld2450-ld2412
          - name: V1 WiFi LD2460
            file: ceilsense-pro-v1/ceilsense-pro-v1-wifi-ld2460.yaml
            artifact: ceilsense-pro-v1-wifi-ld2460
            build_variant: ceilsense-pro-v1-wifi-ld2460
          - name: V1 Ethernet LD2460
            file: ceilsense-pro-v1/ceilsense-pro-v1-ethernet-ld2460.yaml
            artifact: ceilsense-pro-v1-ethernet-ld2460
            build_variant: ceilsense-pro-v1-ethernet-ld2460
          - name: V1 WiFi LD6002B
            file: ceilsense-pro-v1/ceilsense-pro-v1-wifi-ld6002b.yaml
            artifact: ceilsense-pro-v1-wifi-ld6002b
            build_variant: ceilsense-pro-v1-wifi-ld6002b
          - name: V1 Ethernet LD6002B
            file: ceilsense-pro-v1/ceilsense-pro-v1-ethernet-ld6002b.yaml
            artifact: ceilsense-pro-v1-ethernet-ld6002b
            build_variant: ceilsense-pro-v1-ethernet-ld6002b
          - name: V1 WiFi Local
            file: ceilsense-pro-v1/ceilsense-pro-v1-wifi-local.yaml
            artifact: ceilsense-pro-v1-wifi-local
            build_variant: ceilsense-pro-v1-wifi-local
    steps:
      - uses: actions/checkout@v7

      - name: Create build-only secrets
        run: |
          printf 'wifi_ssid: "CI-DUMMY"\nwifi_password: "CI-DUMMY-PASSWORD"\n' > secrets.yaml
          cp secrets.yaml ceilsense-pro-v1/secrets.yaml

      - name: Validate configuration
        run: |
          docker run --rm -v "$PWD":/config -w /config \
            "esphome/esphome:${ESPHOME_VERSION}" config "${{ matrix.file }}"

      - name: Compile firmware
        run: |
          docker run --rm -v "$PWD":/config -w /config \
            "esphome/esphome:${ESPHOME_VERSION}" compile "${{ matrix.file }}"

      - name: Collect firmware
        run: |
          mkdir -p dist
          if [[ "${{ matrix.file }}" == ceilsense-pro-v1/* ]]; then
            build_dir="ceilsense-pro-v1/build/${{ matrix.build_variant }}"
          else
            build_dir=".esphome/build/${{ matrix.build_variant }}"
          fi
          shopt -s nullglob
          factory_bins=("$build_dir"/.pioenvs/*/firmware.factory.bin)
          ota_bins=("$build_dir"/.pioenvs/*/firmware.bin)
          test "${#factory_bins[@]}" -eq 1
          test "${#ota_bins[@]}" -eq 1
          cp "${factory_bins[0]}" "dist/${{ matrix.artifact }}.factory.bin"
          cp "${ota_bins[0]}" "dist/${{ matrix.artifact }}.ota.bin"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.bin
          if-no-files-found: error

  alarm-host-test:
    name: Buzzer and alarm host integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile and run host test
        run: |
          docker run --rm -v "$PWD":/config -w /config \
            --entrypoint /bin/bash "esphome/esphome:${ESPHOME_VERSION}" -lc \
            'esphome compile tests/buzzer-smoke-host.yaml && \
             tests/.esphome/build/ceilsense-pro-buzzer-test/.pioenvs/ceilsense-pro-buzzer-test/program'
