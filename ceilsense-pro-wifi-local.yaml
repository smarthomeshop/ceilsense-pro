# CeilSense Pro local WiFi firmware for direct ESPHome flashing.
substitutions:
  device_name: ceilsense-pro-local
  friendly_name: "CeilSense Pro Local"
  ceilsense_hardware_version: "pro-v1-wifi-local"
  build_variant: "ceilsense-pro-wifi-local"
  default_network: "WiFi Local"
  cloud_enabled: "false"

packages:
  base: !include packages/base.yaml
  network: !include packages/network_wifi_local.yaml
  audio: !include packages/audio_max98357.yaml
  buzzer: !include packages/buzzer.yaml
  scd41: !include packages/scd41.yaml
  sgp41: !include packages/sgp41.yaml
  adpd188bi: !include packages/adpd188bi.yaml
  smoke_alarm: !include packages/smoke_alarm.yaml
  ld2412: !include packages/ld2412.yaml
  ld2450: !include packages/ld2450.yaml
  presence: !include packages/presence.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
